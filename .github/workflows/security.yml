name: Security — Access Analyzer

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Actions are pinned to commit SHAs (mutable-ref supply-chain hardening);
# Dependabot's github-actions ecosystem keeps the pins fresh.
jobs:
  access-analyzer:
    name: IAM Access Analyzer
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: CDK Synth
        run: cdk synth
        env:
          JSII_SILENCE_WARNING_UNTESTED_NODE_VERSION: "1"

      - name: Check no public access
        uses: Specter099/.github/.github/actions/access-analyzer@2633bc5b281230a26aefdd42ee9e6243b0a7ad1f # main 2026-07-09
        with:
          template-dir: cdk.out
          aws-region: us-east-1
