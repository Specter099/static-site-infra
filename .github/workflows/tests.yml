name: Tests & Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint, tests, security audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + locked deps
        # requirements-lock.txt pins the full environment for reproducible
        # CI; the package itself installs editable without re-resolving deps.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -e . --no-deps

      - name: Ruff lint
        run: ruff check .

      - name: Pytest
        # Docker is available on ubuntu-latest, so the Lambda@Edge bundling
        # test runs here too.
        run: pytest tests/ -v

      - name: pip-audit
        # --skip-editable avoids failing on the local editable install; exit
        # code is still nonzero when a real vulnerability is found.
        run: pip-audit --skip-editable
